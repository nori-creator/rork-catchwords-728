<html><head><meta charset="utf-8">

</head><body>
<canvas id="c" width="1080" height="2340"></canvas>
<script src="node_modules/lottie-web/build/player/lottie.min.js"></script>
<script>
// CatchWords — catch → dex concept films. Every frame is a pure function of time t (seconds),
// so the capture script can step through frames at exactly 60 fps.
const W = 1080, H = 2340, FPS = 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const Q = new URLSearchParams(location.search);
let CONCEPT = Q.get('c') || 'A';

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3), inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5), outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2, inQuad: x => x * x, outQuad: x => 1 - (1 - x) * (1 - x),

// damped spring step response (SwiftUI-style response / dampingFraction)
function spring(t, response = .5, damping = .8) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI / response, z = damping;
  if (z >= 1) return 1 - (1 + w * t) * Math.exp(-w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const sp = (t, t0, r, d) => spring(t - t0, r, d);
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function bez2(p0, p1, p2, u) { const v = 1 - u; return [v * v * p0[0] + 2 * v * u * p1[0] + u * u * p2[0], v * v * p0[1] + 2 * v * u * p1[1] + u * u * p2[1]]; }

// ---------- assets ----------
const A = {}; let M;
const img = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(src); i.src = src; });
async function load() {
  M = await (await fetch('assets/meta.json')).json();
  const list = { photo: 'assets/photo_1080.jpg', cut: 'assets/cup_cut.png', shadow: 'assets/cup_shadow.png',
    b4: 'assets/cup_b4.png', b8: 'assets/cup_b8.png', b12: 'assets/cup_b12.png', b16: 'assets/cup_b16.png', b20: 'assets/cup_b20.png', b24: 'assets/cup_b24.png' };
  for (const k of ['coffee', 'soymilk', 'douhua', 'xlb', 'umbrella', 'pcake']) { list['i_' + k] = `assets/items/${k}_stk.png`; list['s_' + k] = `assets/items/${k}_sil.png`; }
  await Promise.all(Object.entries(list).map(async ([k, v]) => A[k] = await img(v)));
  for (const n of ['burst', 'twinkle', 'ripple']) A['L_' + n] = await (await fetch(`lottie/${n}.json`)).json();
  await document.fonts.load('700 40px "Noto Sans TC"'); await document.fonts.load('900 40px "Noto Sans TC"');
  await document.fonts.load('500 40px "Noto Sans JP"'); await document.fonts.load('800 40px "Noto Sans JP"');
  await document.fonts.load('600 40px Inter'); await document.fonts.load('700 40px Inter'); await document.fonts.load('600 40px "Noto Sans JP"'); await document.fonts.load('700 40px "Noto Sans JP"'); await document.fonts.load('500 40px "Noto Sans TC"');
  await document.fonts.ready;
  prepLottie();
}

// lottie players rendered into offscreen canvases, stepped by frame
const LP = {};
function prepLottie() {
  for (const n of ['burst', 'twinkle', 'ripple']) {
    const d = A['L_' + n], c = document.createElement('canvas'); c.width = d.w; c.height = d.h;
    const holder = document.createElement('div'); holder.style.cssText = `position:absolute;left:-9999px;width:${d.w}px;height:${d.h}px`;
    document.body.appendChild(holder);
    const anim = lottie.loadAnimation({ container: holder, renderer: 'canvas', loop: false, autoplay: false, animationData: JSON.parse(JSON.stringify(d)),
      rendererSettings: { context: c.getContext('2d'), clearCanvas: true, preserveAspectRatio: 'xMidYMid meet' } });
    LP[n] = { anim, c, d };
  }
}
function drawLottie(n, t, t0, cx, cy, size, alpha = 1) {
  const L = LP[n], f = (t - t0) * FPS; if (f < 0 || f > L.d.op) return;
  L.anim.goToAndStop(Math.min(f, L.d.op - 1), true);
  ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(L.c, cx - size / 2, cy - size / 2, size, size); ctx.restore();
}

// ---------- scene constants ----------
const CUP = () => M.cup; // tile tx,ty,tw,th (screen coords at rest)
const cupCenter = () => [M.cup.tx + M.cup.tw / 2, M.cup.ty + M.cup.th / 2 + 6];
const TAGS = [
  { id: 'cup', zh: '珍珠奶茶', ja: 'タピオカミルクティー', p: [540, 1560], t: .95 },
  { id: 'plant', zh: '盆栽', ja: '鉢植え', p: [700, 600], t: 1.08 },
  { id: 'scooter', zh: '機車', ja: 'バイク', p: [228, 800], t: 1.2 },
  { id: 'sign', zh: '黑板', ja: '黒板', p: [836, 1080], t: 1.32 },
];
const WORD = [{ h: '珍', z: 'ㄓㄣ', tone: '' }, { h: '珠', z: 'ㄓㄨ', tone: '' }, { h: '奶', z: 'ㄋㄞ', tone: 'ˇ' }, { h: '茶', z: 'ㄔㄚ', tone: 'ˊ' }];
const T_PRESS = .62, T_CAP = .72, T_TAP = 2.12, C0 = 2.22; // catch starts at C0
const FONT_JP = '"Noto Sans JP", Inter, sans-serif', FONT_TC = '"Noto Sans TC", "Noto Sans JP", sans-serif', FONT_UI = 'Inter, "Noto Sans JP", sans-serif';
const BLUE = '#0083FF', INK = '#0B121A', MUTED = '#5C646F';

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, c = ctx) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function font(w, s, f = FONT_JP) { ctx.font = `${w} ${s}px ${f}`; }
function text(s, x, y, { w = 500, size = 40, f = FONT_JP, color = INK, align = 'center', base = 'alphabetic', alpha = 1, ls = 0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; font(w, size, f); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, w, size, f = FONT_JP, ls = 0) { ctx.save(); font(w, size, f); if (ls) ctx.letterSpacing = ls + 'px'; const m = ctx.measureText(s).width; ctx.restore(); return m; }

// backdrop: each frame draws its background into BG; a small blurred copy serves every glass surface
const BG = document.createElement('canvas'); BG.width = W; BG.height = H; const bgx = BG.getContext('2d');
const BL = document.createElement('canvas'); BL.width = W / 4; BL.height = H / 4; const blx = BL.getContext('2d');
function makeBlur() { blx.clearRect(0, 0, BL.width, BL.height); blx.filter = 'blur(6px)'; blx.drawImage(BG, -8, -8, BL.width + 16, BL.height + 16); blx.filter = 'none'; }
function glass(x, y, w, h, r, { tint = 'rgba(255,255,255,0.58)', dark = false, alpha = 1, shadow = .16 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  if (shadow) { ctx.save(); ctx.shadowColor = `rgba(0,0,0,${shadow})`; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12; rr(x, y, w, h, r); ctx.fillStyle = dark ? 'rgba(20,24,32,0.4)' : 'rgba(255,255,255,0.2)'; ctx.fill(); ctx.restore(); }
  ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.drawImage(BL, 0, 0, W, H);
  ctx.fillStyle = dark ? 'rgba(18,22,30,0.42)' : tint; ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, dark ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.45)'); g.addColorStop(.55, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
  rr(x + 1, y + 1, w - 2, h - 2, r - 1); ctx.lineWidth = 2; ctx.strokeStyle = dark ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.85)'; ctx.stroke();
  ctx.restore();
}

// iOS chrome
function statusBar(dark = false) {
  const c = dark ? '#000' : '#fff';
  text('9:41', 150, 98, { w: 600, size: 52, f: FONT_UI, color: c });
  ctx.save(); ctx.fillStyle = c; ctx.strokeStyle = c;
  // signal
  for (let i = 0; i < 4; i++) { rr(780 + i * 20, 92 - 12 - i * 8, 13, 12 + i * 8, 3); ctx.fill(); }
  // wifi
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(890, 96, 10 + i * 13, Math.PI * 1.25, Math.PI * 1.75); ctx.stroke(); }
  // battery
  ctx.globalAlpha = .4; rr(935, 66, 76, 36, 11); ctx.lineWidth = 3; ctx.stroke(); rr(1015, 78, 6, 13, 2); ctx.fill(); ctx.globalAlpha = 1;
  rr(940, 71, 62, 26, 7); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#000'; rr(W / 2 - 189, 33, 378, 111, 56); ctx.fill(); // dynamic island
}
function homeIndicator(dark = false) { ctx.fillStyle = dark ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.92)'; rr(W / 2 - 201, H - 30, 402, 15, 8); ctx.fill(); }

const TAB_Y = H - 72 - 186, TAB_H = 186, TAB_X = 54, TAB_W = W - 108;
const TABS = [['house', 'ホーム'], ['book', '図鑑'], ['camera', 'カメラ'], ['sparkles', '復習'], ['gear', '設定']];
function tabCenter(i) { return [TAB_X + TAB_W / 10 * (2 * i + 1), TAB_Y + 72]; }
function icon(name, x, y, s, color, lw = 7) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 72, s / 72); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  if (name === 'house') { ctx.moveTo(-28, -2); ctx.lineTo(0, -28); ctx.lineTo(28, -2); ctx.moveTo(-20, -8); ctx.lineTo(-20, 26); ctx.lineTo(20, 26); ctx.lineTo(20, -8); ctx.moveTo(-6, 26); ctx.lineTo(-6, 8); ctx.lineTo(6, 8); ctx.lineTo(6, 26); ctx.stroke(); }
  if (name === 'book') { ctx.moveTo(0, -18); ctx.quadraticCurveTo(-14, -28, -32, -24); ctx.lineTo(-32, 22); ctx.quadraticCurveTo(-14, 18, 0, 26); ctx.quadraticCurveTo(14, 18, 32, 22); ctx.lineTo(32, -24); ctx.quadraticCurveTo(14, -28, 0, -18); ctx.lineTo(0, 26); ctx.stroke(); }
  if (name === 'camera') { ctx.roundRect(-32, -18, 64, 46, 10); ctx.moveTo(-12, -18); ctx.lineTo(-6, -28); ctx.lineTo(6, -28); ctx.lineTo(12, -18); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 4, 12, 0, Math.PI * 2); ctx.stroke(); }
  if (name === 'sparkles') { const st = (cx, cy, R) => { ctx.moveTo(cx, cy - R); ctx.quadraticCurveTo(cx, cy, cx + R, cy); ctx.quadraticCurveTo(cx, cy, cx, cy + R); ctx.quadraticCurveTo(cx, cy, cx - R, cy); ctx.quadraticCurveTo(cx, cy, cx, cy - R); }; st(-6, 4, 24); st(20, -18, 11); ctx.stroke(); }
  if (name === 'gear') { ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; ctx.moveTo(Math.cos(a) * 20, Math.sin(a) * 20); ctx.lineTo(Math.cos(a) * 29, Math.sin(a) * 29); } ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.stroke(); }
  if (name === 'speaker') { ctx.moveTo(-26, -10); ctx.lineTo(-12, -10); ctx.lineTo(4, -24); ctx.lineTo(4, 24); ctx.lineTo(-12, 10); ctx.lineTo(-26, 10); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(6, 0, 16, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(6, 0, 28, -0.8, 0.8); ctx.stroke(); }
  if (name === 'pin') { ctx.moveTo(0, 28); ctx.bezierCurveTo(-30, -2, -22, -28, 0, -28); ctx.bezierCurveTo(22, -28, 30, -2, 0, 28); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -8, 8, 0, Math.PI * 2); ctx.fill(); }
  if (name === 'flash') { ctx.moveTo(6, -30); ctx.lineTo(-16, 4); ctx.lineTo(2, 4); ctx.lineTo(-6, 30); ctx.lineTo(16, -6); ctx.lineTo(-2, -6); ctx.closePath(); ctx.stroke(); }
  if (name === 'flip') { ctx.arc(0, 0, 22, -2.6, 0.3); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 22, 0.55, 3.4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(22, 4); ctx.lineTo(16, -6); ctx.lineTo(28, -6); ctx.closePath(); ctx.fill(); }
  if (name === 'retake') { ctx.arc(0, 0, 20, -0.4, 4.4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(18, -16); ctx.lineTo(20, 0); ctx.lineTo(4, -4); ctx.stroke(); }
  if (name === 'check') { ctx.moveTo(-18, 2); ctx.lineTo(-5, 15); ctx.lineTo(20, -12); ctx.stroke(); }
  ctx.restore();
}
function tabBar({ sel = 2, alpha = 1, dy = 0, bump = 0, badge = 0, badgeT = -1, t = 0, dark = false } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.translate(0, dy);
  glass(TAB_X, TAB_Y, TAB_W, TAB_H, TAB_H / 2, { alpha, tint: 'rgba(255,255,255,0.62)' });
  ctx.globalAlpha = alpha;
  TABS.forEach(([ic, label], i) => {
    const [cx, cy] = tabCenter(i); const on = i === sel;
    if (on) { ctx.fillStyle = 'rgba(0,131,255,0.13)'; rr(cx - 92, TAB_Y + 18, 184, TAB_H - 36, (TAB_H - 36) / 2); ctx.fill(); }
    const s = i === 1 ? 1 + bump : 1;
    ctx.save(); ctx.translate(cx, cy - 6); ctx.scale(s, s); icon(ic, 0, 0, 66, on ? BLUE : '#3A4250'); ctx.restore();
    text(label, cx, TAB_Y + 148, { w: 600, size: 29, color: on ? BLUE : '#3A4250' });
  });
  if (badge > 0) { // rolling badge on 図鑑
    const [cx, cy] = tabCenter(1); const k = badgeT < 0 ? 1 : E.outBack(clamp((t - badgeT) / .35), 2.6);
    ctx.save(); ctx.translate(cx + 34, cy - 40); ctx.scale(k, k); ctx.fillStyle = '#FF3B30'; rr(-30, -24, 60, 48, 24); ctx.fill();
    text('+1', 0, 12, { w: 700, size: 32, f: FONT_UI, color: '#fff' }); ctx.restore();
  }
  ctx.restore();
}

// tags (glass callouts anchored on objects)
function tagGeom(tag) {
  const w1 = measure(tag.zh, 700, 46, FONT_TC), w2 = measure(tag.ja, 500, 28);
  const w = Math.max(w1, w2) + 60, h = 112; return { w, h, x: tag.p[0] - w / 2, y: tag.p[1] - 30 - h };
}
function drawTag(tag, t, { alpha = 1, press = 0, done = 0 } = {}) {
  const k = sp(t, tag.t + .1, .42, .62); if (k <= 0.001 || alpha <= 0) return;
  const appear = clamp(k); const g = tagGeom(tag);
  // anchor dot with soft pulse
  const pd = seg(t, tag.t, tag.t + .6);
  ctx.save(); ctx.globalAlpha = alpha * clamp((t - tag.t) / .15);
  ctx.fillStyle = `rgba(255,255,255,${.5 * (1 - pd)})`; ctx.beginPath(); ctx.arc(tag.p[0], tag.p[1], 14 + 46 * E.outCubic(pd), 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 10; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(tag.p[0], tag.p[1], 11, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // stem
  ctx.save(); ctx.globalAlpha = alpha * appear; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(tag.p[0], tag.p[1] - 12); ctx.lineTo(tag.p[0], tag.p[1] - 12 - 18 * appear); ctx.stroke(); ctx.restore();
  // pill
  const s = (0.6 + 0.4 * k) * (1 - press * .07);
  ctx.save(); ctx.translate(tag.p[0], tag.p[1] - 30); ctx.scale(s, s); ctx.translate(-tag.p[0], -(tag.p[1] - 30));
  const a = alpha * clamp(k * 1.4);

  glass(g.x, g.y, g.w, g.h, 34, { alpha: a * (1 - done), tint: 'rgba(255,255,255,0.72)' });
  text(tag.zh, tag.p[0], g.y + 56, { w: 700, size: 46, f: FONT_TC, color: done > .5 ? '#fff' : INK, alpha: a });
  text(tag.ja, tag.p[0], g.y + 94, { w: 500, size: 28, color: done > .5 ? 'rgba(255,255,255,0.9)' : MUTED, alpha: a });
  ctx.restore();
}

// touch indicator: appear, press, release ripple
function finger(x, y, t, tIn, tPress, tOut = tPress + .35) {
  if (t < tIn || t > tOut + .4) return;
  const a = seg(t, tIn, tIn + .12) * (1 - seg(t, tOut, tOut + .2));
  const pr = seg(t, tPress, tPress + .08) * (1 - seg(t, tPress + .1, tPress + .22));
  const rip = seg(t, tPress + .08, tPress + .5);
  ctx.save();
  if (rip > 0 && rip < 1) { ctx.globalAlpha = (1 - rip) * .55; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 46 + 70 * E.outCubic(rip), 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = a; ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 24;
  ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.beginPath(); ctx.arc(x, y, 46 * (1 - .14 * pr), 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
  ctx.restore();

// zhuyin word: characters with the bopomofo column on their right (Taiwan style)
function zhuyinWord(x, y, size, t, t0, { color = INK, zcolor = MUTED, stagger = .05, dur = .32, alpha = 1, align = 'center' } = {}) {
  const zs = size * .31, cell = size + zs * 1.2, total = cell * WORD.length - zs * .2;
  let cx = align === 'center' ? x - total / 2 : x;
  WORD.forEach((ch, i) => {
    const u = E.outCubic(seg(t, t0 + i * stagger, t0 + i * stagger + dur)); if (u <= 0) { cx += cell; return; }
    ctx.save(); ctx.globalAlpha = alpha * u; ctx.translate(0, (1 - u) * size * .22);
    if (u < 1) ctx.filter = `blur(${(1 - u) * 10}px)`;
    text(ch.h, cx + size / 2, y, { w: 700, size, f: FONT_TC, color });
    const zx = cx + size + zs * .62, n = ch.z.length, top = y - size * .42 - (n * zs * 1.02) / 2;
    [...ch.z].forEach((z, j) => text(z, zx, top + (j + 1) * zs * 1.02, { w: 500, size: zs, f: FONT_TC, color: zcolor }));
    if (ch.tone) text(ch.tone, zx + zs * .62, top + zs * 1.02 * (n - .35), { w: 700, size: zs * .9, f: FONT_TC, color: zcolor });
    ctx.restore(); cx += cell;
  });
  return total;
}

// speaker button with voice wave rings
function speakerBtn(x, y, r, t, tVoice, { alpha = 1, blue = true } = {}) {
  ctx.save(); ctx.globalAlpha = alpha;
  const v = seg(t, tVoice, tVoice + .9);
  if (v > 0 && v < 1) for (let k = 0; k < 2; k++) { const u = clamp(v * 1.4 - k * .3); if (u <= 0 || u >= 1) continue; ctx.globalAlpha = alpha * (1 - u) * .5; ctx.strokeStyle = BLUE; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, r + 40 * E.outCubic(u), 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = alpha; ctx.shadowColor = 'rgba(0,131,255,0.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = blue ? BLUE : 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowColor = 'transparent';
  icon('speaker', x - 2, y, r * 1.05, blue ? '#fff' : BLUE, 6);
  ctx.restore();
}

// ---------- sticker composite ----------
const SK = document.createElement('canvas'); const skx = SK.getContext('2d');
const HL = document.createElement('canvas'); const hlx = HL.getContext('2d');
function borderImg(r) { // crossfade between baked radii
  const rs = [4, 8, 12, 16, 20, 24]; r = clamp(r, 0, 24);

  let lo = rs[0], hi = rs[0];
  for (let i = 0; i < rs.length; i++) { if (rs[i] <= r) lo = rs[i]; if (rs[i] >= r) { hi = rs[i]; break; } }
  if (r < 4) return [[A.b4, r / 4]];
  if (lo === hi) return [[A['b' + lo], 1]];
  const f = (r - lo) / (hi - lo); return [[A['b' + lo], 1], [A['b' + hi], f]];
}
// returns canvas with border + cutout (+ optional sheen / holo)
function sticker({ border = 20, sheen = -1, holo = -1, white = 1, alphaCut = 1 } = {}) {
  const c = M.cup; if (SK.width !== c.tw) { SK.width = c.tw; SK.height = c.th; }
  skx.clearRect(0, 0, SK.width, SK.height);
  skx.globalAlpha = white; for (const [im, a] of borderImg(border)) { skx.globalAlpha = a * white; skx.drawImage(im, 0, 0); }

// =========================================================================================
// Concept C — Instant: the fastest path. The cup pops into a sticker where it stands, the tag turns into
// the answer (word + voice), a small copy shoots into 図鑑 and the camera is ready for the next word.
function conceptC(t) {
  const C = C0, cc = cupCenter();

  topPill(t, T_CAP + .15, 1.62, 'AIが見つけています', { shimmer: true });
  topPill(t, 1.66, C, '覚えたいことばをタップ');

    const k = clamp(pop, 0, 1.3), s = 1 + .07 * Math.sin(Math.min(1, k) * Math.PI / 2) * (1 - back) + .02 * (k - 1) * (1 - back);
    const border = 18 * Math.min(1, k * 1.4) * (1 - back);

    placeTile(sticker({ border, sheen: seg(t, C + .05, C + .4) }), cc[0], cc[1] - 14 * Math.min(1, k) * (1 - back), s, 0, 1 - back * 0);
  }

    const tgt = tabCenter(1), p0 = [cc[0], cc[1] - 20];

      placeTile(stk, p[0], p[1], lerp(.42, .08, ek), -.3 * ek, k2 ? .14 / k2 : 1);

const DUR = { A: 5.9, B: 6.4, C: 4.2, D: 5.9 };
