# iOS 版を App Store Connect（TestFlight）へ送る — Rork も Mac も使わない
#
# 使い方（手順の全体は docs/self-managing-ios.md）:
#   GitHub → Actions → 「iOS release（App Store Connect へ送る）」→ Run workflow
#   約 15〜25 分で App Store Connect の TestFlight に新しいビルドが届く。
#   そこから TestFlight で配る／審査に出す、は App Store Connect の画面で行う。
#
# 事前に GitHub の Settings → Secrets and variables → Actions に入れておく 4 つ:
#   APPLE_TEAM_ID        … Apple Developer のチーム ID（10 桁の英数字）
#   ASC_KEY_ID           … App Store Connect API キーの「キー ID」
#   ASC_ISSUER_ID        … 同じ画面の「Issuer ID」
#   ASC_KEY_P8           … ダウンロードした AuthKey_XXXX.p8 をメモ帳などで開いた中身をそのまま貼る
#                          （「-----BEGIN PRIVATE KEY-----」から「-----END PRIVATE KEY-----」まで全部）
#                          ※ 以前の ASC_KEY_P8_BASE64（base64 にした文字列）でも動く
#
# 署名（証明書・プロファイル）は Apple のクラウド署名に任せる
# （-allowProvisioningUpdates + API キー）。手元に証明書を持たなくてよい。
# 自動署名のアーカイブは一度「開発用」で署名し、送る時に配布用で署名し直す。開発用の
# プロファイルを作るため、Apple Developer に端末が1台以上登録されている必要がある
# （無いと「Your team has no devices」で止まる。手順書の「端末を1台登録する」）。
name: iOS release（App Store Connect へ送る）

on:
  workflow_dispatch:
    inputs:
      build_offset:
        description: "ビルド番号の下駄（Rork で送ったビルドより大きくするため）。通常はそのまま"
        required: false
        default: "1000"

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 必要な設定がそろっているか確かめる
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$ASC_KEY_P8" ] || [ -n "$ASC_KEY_P8_BASE64" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Secrets が足りません:$missing（docs/self-managing-ios.md の手順 3）"
            exit 1
          fi

      - name: API キーを一時ファイルに置く
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          else
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::ASC_KEY_P8 の中身が .p8 の形ではありません（BEGIN PRIVATE KEY から END PRIVATE KEY まで全部貼ってください）"; exit 1; }

      - name: Xcode の版を表示
        run: xcodebuild -version

      - name: アーカイブ（App Store 用に組み立てて署名する）
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_OFFSET: ${{ inputs.build_offset }}
        run: |
          set -o pipefail
          BUILD_NUMBER=$(( ${BUILD_OFFSET:-1000} + GITHUB_RUN_NUMBER ))
          echo "build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project CatchWords.xcodeproj \
            -scheme CatchWords \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CatchWords.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)|Signing Identity|Provisioning Profile" || true
          if grep -q "has no devices" "$RUNNER_TEMP/archive.log"; then
            # 端末が1台も登録されていないと、開発用の署名ができない。署名せずにアーカイブし、
            # 送る時（exportArchive）に配布用で署名させる。
            echo "::warning::端末が登録されていないので、署名せずにアーカイブして、送る時に配布用で署名します"
            rm -rf "$RUNNER_TEMP/CatchWords.xcarchive"
            xcodebuild archive \
              -project CatchWords.xcodeproj \
              -scheme CatchWords \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/CatchWords.xcarchive" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGNING_ALLOWED=NO \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          fi
          test -d "$RUNNER_TEMP/CatchWords.xcarchive" || { echo "::error::アーカイブに失敗しました（archive.log を見てください）"; exit 1; }

      - name: App Store Connect へ送る
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CatchWords.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload|upload" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log" || { echo "::error::配布用の署名に失敗しました（export.log を見てください）"; exit 1; }
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "ipa: $IPA"
          # 配布用で署名されたか・Apple でサインインの権限が残っているかを記録に出す
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.plist" | grep -A3 "applesignin" || echo "::warning::Apple でサインインの権限が入っていません（この版では「Appleでサインイン」が使えません。メールでのログインは使えます）"
          # App Store Connect へ送る（API キーは altool が決まった場所から読む）
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          grep -qiE "No errors uploading|UPLOAD SUCCEEDED" "$RUNNER_TEMP/upload.log" || { echo "::error::App Store Connect への送信に失敗しました（upload.log を見てください）"; exit 1; }
          echo "::notice::App Store Connect に送りました。処理が終わると TestFlight に表示されます（10〜30 分）。"

      - name: API キーを消す
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: 記録を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
            ${{ runner.temp }}/entitlements.plist
          if-no-files-found: ignore
          retention-days: 14
