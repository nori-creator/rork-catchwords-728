# App Store Connect の今の状態を読む（読むだけ。何も書き換えず、審査にも出さない）
#
# 何をするか:
#   App Store Connect API で、アプリの記録・各言語の名前と説明・年齢区分の答え・バージョンの状態・
#   付いているビルド・審査の情報が入っているか・スクリーンショットの枚数・最近のビルド・審査への提出・
#   アプリ内課金の商品・配信する国を読み、結果を ci-previews ブランチの runs/store-status/ に置く
#   （status.md と status.json。Claude が読める場所）。
#
# 公開リポジトリなので、出すのは状態と枚数だけ。審査用アカウントのメール・パスワード、連絡先、
# 審査メモの本文は「入っているか」と長さしか出さない（scripts/asc_store_status.py）。
#
# 使い方: GitHub → Actions →「App Store status（今の状態を読む）」→ Run workflow
# 必要な Secrets は iOS release と同じ ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8。
name: App Store status（今の状態を読む）

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/asc_store_status.py
      - .github/workflows/ios-store-status.yml

concurrency:
  group: ios-store-status
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: API キーを一時ファイルに置く
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          else
            echo "::error::Secrets の ASC_KEY_P8 がありません（docs/self-managing-ios.md の手順 2-4）"; exit 1
          fi
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: App Store Connect を読む
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/store"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 scripts/asc_store_status.py com.nori.catchwords \
            "$RUNNER_TEMP/store/status.json" > "$RUNNER_TEMP/store/status.md"
          cat "$RUNNER_TEMP/store/status.md" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: ci-previews ブランチに置く
        if: always()
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/store"
          [ -f "$SRC/status.md" ] || exit 0
          DEST="$RUNNER_TEMP/previews-branch"
          git clone --quiet --depth 1 --branch ci-previews "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DEST"
          cd "$DEST"
          mkdir -p runs/store-status
          cp "$SRC"/status.md "$SRC"/status.json runs/store-status/
          echo "${{ github.sha }}" > runs/store-status/COMMIT
          git add -A
          git -c user.name="ios-store-status" -c user.email="ios-store-status@users.noreply.github.com" commit --quiet -m "store status @ ${{ github.sha }}" || exit 0
          for i in 1 2 3; do git pull --quiet --rebase origin ci-previews 2>/dev/null; git push --quiet origin ci-previews && break; sleep 3; done
